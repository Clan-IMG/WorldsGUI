name: Build & Deploy Plugin

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # WICHTIG:
    # Hier den Namen deines GitHub-Environments eintragen
    environment: push

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Java installieren
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle ausführbar machen
        run: chmod +x gradlew

      - name: Plugin bauen
        run: ./gradlew clean build

      - name: SSH vorbereiten
        env:
          SERVER_HOST: ${{ vars.SERVER_HOST }}
          SERVER_PORT: ${{ vars.SERVER_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh

          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan \
            -p "$SERVER_PORT" \
            -H "$SERVER_HOST" \
            >> ~/.ssh/known_hosts

      - name: Plugin deployen
        env:
          SERVER_HOST: ${{ vars.SERVER_HOST }}
          SERVER_PORT: ${{ vars.SERVER_PORT }}
          SERVER_USER: ${{ vars.SERVER_USER }}
          PLUGIN_PATH: ${{ vars.PLUGIN_PATH }}
        run: |
          while IFS= read -r path; do
            # Im Browser eingetragene Variablen haben Windows-Zeilenenden – \r gehört nicht zum Pfad.
            path="${path%$'\r'}"
            [ -z "$path" ] && continue

            echo "Deploy nach: $path"

            scp \
              -P "$SERVER_PORT" \
              build/libs/*.jar \
              "$SERVER_USER@$SERVER_HOST:$path"

          done <<< "$PLUGIN_PATH"