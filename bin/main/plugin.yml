name: WorldsGUI
description: $description
prefix: [ WorldsGUI ]
version: '${version}'

main: net.clanimg.worldsGUI.WorldsGUI
api-version: '1.21'
load: POSTWORLD

authors: [ WrobelXXL ]
website: https://clan-img.net

commands:
  nav:
    description: Öffnet die WorldsGUI Navigation
    permission: worldsgui.command.nav
    usage: /nav [create|delete|join|my-world|setspawn|status|rename|icon]
  setspawn:
    description: Setzt den Spawn deiner ausgewählten Welt
    permission: worldsgui.command.setspawn
    usage: /setspawn
  rename:
    description: Ändert den Anzeigenamen der ausgewählten Welt
    permission: worldsgui.command.rename
    usage: /rename [name]
  icon:
    description: Ändert das Icon der ausgewählten Welt
    permission: worldsgui.command.icon
    usage: /icon [material]
  status:
    description: Zeigt den Status an
    permission: worldsgui.command.status
    usage: /status
  verify:
    description: Verifiziert deinen Minecraft-Namen mit 4-stelligem Code aus dem Dashboard
    permission: worldsgui.command.verify
    usage: /verify <code>
  unverify:
    description: Entfernt deine Minecraft-Verifizierung
    permission: worldsgui.command.unverify
    usage: /unverify
  join:
    description: Wechselt die Konsole in einen Spieler-Modus
    usage: /join <player>
  exit:
    description: Beendet den Spieler-Modus der Konsole
    usage: /exit

permissions:
  worldsgui.use:
    description: Allgemeiner Zugriff auf WorldsGUI
    default: op
  worldsgui.command.nav:
    description: Erlaubt /nav
    default: op
  worldsgui.command.nav.create:
    description: Erlaubt /nav create (nur wenn dem Auftrag zugewiesen)
    default: op
  worldsgui.command.nav.delete:
    description: Erlaubt /nav delete (archiviert die Welt)
    default: op
  worldsgui.command.nav.join:
    description: Erlaubt /nav join (enable/disable)
    default: op
  worldsgui.command.nav.join.enable:
    description: Erlaubt /nav join enable
    default: op
  worldsgui.command.nav.join.disable:
    description: Erlaubt /nav join disable
    default: op
  worldsgui.command.nav.my-world:
    description: Erlaubt /nav my-world
    default: op
  worldsgui.command.nav.my-world.create:
    description: Erlaubt /nav my-world create (Cooldown 5 Min., außer worldsgui.admin)
    default: op
  worldsgui.command.nav.my-world.delete:
    description: Erlaubt /nav my-world delete [confirm]
    default: op
  worldsgui.command.nav.my-world.open:
    description: Erlaubt /nav my-world open
    default: op
  worldsgui.command.nav.my-world.closed:
    description: Erlaubt /nav my-world closed
    default: op
  worldsgui.command.nav.my-world.trust:
    description: Erlaubt /nav my-world trust (nur TEAM_ROLE-Mitglieder, müssen verifiziert sein)
    default: op
  worldsgui.command.nav.my-world.untrust:
    description: Erlaubt /nav my-world untrust
    default: op
  worldsgui.command.nav.my-world.rename:
    description: Erlaubt /nav my-world rename
    default: op
  worldsgui.command.nav.my-world.icon:
    description: Erlaubt /nav my-world icon
    default: op
  worldsgui.command.nav.my-world.clone:
    description: Erlaubt /nav my-world clone <world-name> [player]
    default: op
  worldsgui.command.nav.setspawn:
    description: Erlaubt /nav setspawn
    default: op
  worldsgui.command.nav.status:
    description: Erlaubt /nav status
    default: op
  worldsgui.command.nav.rename:
    description: Erlaubt /nav rename
    default: op
  worldsgui.command.nav.icon:
    description: Erlaubt /nav icon
    default: op
  worldsgui.command.setspawn:
    description: Erlaubt /setspawn
    default: op
  worldsgui.command.rename:
    description: Erlaubt /rename
    default: op
  worldsgui.command.icon:
    description: Erlaubt /icon
    default: op
  worldsgui.command.status:
    description: Erlaubt /status
    default: op
  worldsgui.command.verify:
    description: Erlaubt /verify
    default: op
  worldsgui.command.unverify:
    description: Erlaubt /unverify
    default: op
  worldsgui.admin:
    description: Hat alle Rechte, sieht alle Aufträge/Welten sowie private Welten bei Einladung, Cooldown bei my-world create betrifft diese Permission nicht
    default: op