api:
  # Base URL for worlds endpoints (without trailing slash)
  base-url: "https://worldsgui.clan-img.net"
  token: ""
  # Optional: Base URL for profile/verify endpoints.
  # Set this to api.clan-img.net if /verify is handled by the main API service.
  profile-base-url: ""
  profile-token: ""

worldguard:
  # Optional command templates for trust/untrust automation.
  # Placeholders: %world% and %player%
  # If empty, plugin uses:
  # trust   -> rg addmember global -w %world% %player%
  # untrust -> rg removemember global -w %world% %player%
  trust-command: ""
  untrust-command: ""

velocity:
  # Optional command template for network transfer from join requests.
  # Example: "sendtoworld %player% %world%"
  # Leave empty to use local Paper teleport fallback.
  transfer-command: ""

